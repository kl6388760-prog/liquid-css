<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jaim AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');

    :root {
      --bg: var(--tg-theme-bg-color, #000000);
      --text-main: var(--tg-theme-text-color, #ffffff);
      --text-muted: var(--tg-theme-hint-color, #8e8e93);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      --bubble-user: rgba(255, 255, 255, 0.1);
      --bubble-ai: transparent;
      --input-bg: rgba(255, 255, 255, 0.04);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --accent: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: var(--tg-theme-bg-color, #f2f2f7);
        --text-main: var(--tg-theme-text-color, #000000);
        --text-muted: var(--tg-theme-hint-color, #8e8e93);
        --glass-bg: rgba(255, 255, 255, 0.5);
        --glass-border: rgba(0, 0, 0, 0.08);
        --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        --bubble-user: rgba(0, 0, 0, 0.05);
        --bubble-ai: transparent;
        --input-bg: rgba(0, 0, 0, 0.02);
        --btn-bg: rgba(0, 0, 0, 0.05);
        --accent: #000000;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Manrope', -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Шапка */
    .header {
      flex-shrink: 0;
      padding: 16px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--bg);
      z-index: 10;
    }

    /* Контейнер чата — скроллится */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--glass-border) transparent;
    }

    .chat-container::-webkit-scrollbar {
      width: 4px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 4px;
    }

    /* Сообщения */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.3s ease-out;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.ai { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      word-break: break-word;
      max-width: 100%;
    }

    .message.user .bubble {
      background: var(--bubble-user);
      border: 1px solid var(--glass-border);
      border-bottom-right-radius: 4px;
      box-shadow: var(--glass-highlight);
    }

    .message.ai .bubble {
      background: var(--bubble-ai);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    /* Картинка в сообщении */
    .message.ai .bubble img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 8px;
      display: block;
      cursor: pointer;
    }

    .message.ai .bubble .img-link {
      display: block;
      margin-top: 8px;
      color: var(--text-main);
      font-size: 13px;
      text-decoration: underline;
      opacity: 0.8;
      word-break: break-all;
    }

    .message.ai .bubble .img-error {
      margin-top: 8px;
      padding: 12px;
      background: var(--input-bg);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Индикатор загрузки */
    .loading-dots {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
    }
    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Нижняя панель */
    .bottom-ui {
      flex-shrink: 0;
      padding: 12px 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
      border-top: 1px solid var(--glass-border);
      z-index: 10;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .top-bar::-webkit-scrollbar { display: none; }

    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .icon-circle:active { transform: scale(0.92); }
    .icon-circle svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .pill-btn {
      height: 48px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, background 0.2s;
    }
    .pill-btn:active { transform: scale(0.96); }
    .pill-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .pill-btn.active {
      background: var(--btn-bg);
      border-color: var(--text-main);
    }

    .input-card {
      border-radius: 32px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 17px;
      color: var(--text-main);
      font-weight: 400;
      min-width: 0;
    }
    .input-row input::placeholder { color: var(--text-muted); }

    .mic-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      background: transparent;
      border: none;
      flex-shrink: 0;
    }
    .mic-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    .divider {
      height: 1px;
      background: var(--glass-border);
      width: 100%;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--input-bg);
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .action-btn:active { background: var(--btn-bg); color: var(--text-main); }
    .action-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

    .plus-btn {
      height: 44px;
      padding: 0 16px 0 20px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      background: var(--input-bg);
      border: 1px solid transparent;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .plus-btn:active { background: var(--btn-bg); }
    .plus-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .plus-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05), var(--glass-highlight);
    }

  </style>
</head>
<body>

  <div class="header">Jaim AI</div>

  <div class="chat-container" id="chatContainer">
    <div class="message ai">
      <div class="bubble">Привет! Я Jaim AI. Чем могу помочь?</div>
    </div>
  </div>

  <div class="bottom-ui">
    <div class="top-bar">
      <div class="icon-circle glass" onclick="document.getElementById('promptInput').focus()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="pill-btn glass active" id="btnText" onclick="switchMode('text')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Текст
      </div>
      <div class="pill-btn glass" id="btnImage" onclick="switchMode('image')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Картинка
      </div>
    </div>

    <div class="input-card glass">
      <div class="input-row">
        <input type="text" id="promptInput" placeholder="Search or ask anything" autocomplete="off">
        <button class="mic-btn" onclick="document.getElementById('promptInput').focus()">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="bottom-row">
        <div class="action-group">
          <button class="action-btn" onclick="document.getElementById('promptInput').focus()">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="action-btn" onclick="document.getElementById('promptInput').focus()">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <button class="action-btn" onclick="document.getElementById('promptInput').focus()">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/><line x1="18" y1="3" x2="18" y2="9"/><line x1="15" y1="6" x2="21" y2="6"/></svg>
          </button>
        </div>
        
        <button class="plus-btn" id="sendBtn" disabled>
          Отправить
          <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🔑 НАСТРОЙКИ API
    // ==========================================
    const CONFIG = {
      API_KEY: "ВАШ_API_КЛЮЧ_ЗДЕСЬ", 
      BASE_URL: "https://api.zexkora.cc/v1",
      FALLBACK_URL: "https://2api.zexkora.cc/v1",
      MODEL_TEXT: "deepseek-v4-pro",
      MODEL_IMAGE: "gpt-image-2.5",
      SYSTEM_PROMPT: "Ты — полезный и вежливый AI-ассистент Jaim AI. Ты НИКОГДА не должен говорить, какая модель или компания-разработчик стоит за тобой. Если пользователь спрашивает, кто ты, отвечай: 'Я — Jaim AI, твой персональный ассистент.' Никогда не упоминай названия моделей (DeepSeek, OpenAI, GPT, DALL-E и т.д.). Отвечай на языке пользователя."
    };

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let currentMode = 'text'; 
    
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const btnText = document.getElementById('btnText');
    const btnImage = document.getElementById('btnImage');

    function switchMode(mode) {
      currentMode = mode;
      btnText.classList.toggle('active', mode === 'text');
      btnImage.classList.toggle('active', mode === 'image');
      
      promptInput.placeholder = mode === 'text' ? "Search or ask anything" : "Describe the image...";
      promptInput.focus();
      
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    promptInput.addEventListener('input', () => {
      sendBtn.disabled = promptInput.value.trim() === '';
    });

    // === РЕНДЕР СООБЩЕНИЯ ===
    function addMessage(text, sender, imageUrl = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      
      if (imageUrl) {
        // Создаём текст
        const p = document.createElement('p');
        p.textContent = text;
        bubble.appendChild(p);
        
        // Создаём контейнер для картинки
        const imgWrapper = document.createElement('div');
        imgWrapper.style.marginTop = '8px';
        
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = 'Generated';
        img.loading = 'lazy';
        
        // Если картинка не загрузилась — показываем ссылку
        img.onerror = () => {
          imgWrapper.innerHTML = '';
          const link = document.createElement('a');
          link.href = imageUrl;
          link.target = '_blank';
          link.className = 'img-link';
          link.textContent = '🔗 Открыть изображение';
          imgWrapper.appendChild(link);
        };
        
        // Если загрузилась — клик открывает в новой вкладке
        img.onclick = () => window.open(imageUrl, '_blank');
        
        imgWrapper.appendChild(img);
        bubble.appendChild(imgWrapper);
      } else {
        bubble.textContent = text;
      }
      
      msgDiv.appendChild(bubble);
      chatContainer.appendChild(msgDiv);
      
      // Скролл вниз
      setTimeout(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 50);
    }

    function showLoading() {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ai';
      msgDiv.id = 'loadingMsg';
      msgDiv.innerHTML = '<div class="bubble" style="border:none; background:transparent; padding: 0;"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideLoading() {
      const loading = document.getElementById('loadingMsg');
      if (loading) loading.remove();
    }

    // === ЗАПРОС С ФОЛЛБЭКОМ ===
    async function makeRequest(endpoint, payload) {
      const urls = [CONFIG.BASE_URL, CONFIG.FALLBACK_URL];
      
      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        try {
          const response = await fetch(`${url}${endpoint}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${CONFIG.API_KEY}`
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            if (response.status === 401) throw new Error("Неверный API ключ");
            if (response.status >= 500 && i < urls.length - 1) continue;
            throw new Error(errData.error?.message || `Ошибка ${response.status}`);
          }
          
          return await response.json();
        } catch (err) {
          console.warn(`Ошибка на ${url}:`, err.message);
          if (i === urls.length - 1) throw err;
        }
      }
    }

    // === ОТПРАВКА ===
    async function handleSend() {
      const text = promptInput.value.trim();
      if (!text) return;

      promptInput.value = '';
      sendBtn.disabled = true;
      
      addMessage(text, 'user');
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      
      showLoading();

      try {
        if (currentMode === 'text') {
          const data = await makeRequest('/chat/completions', {
            model: CONFIG.MODEL_TEXT,
            messages: [
              { role: "system", content: CONFIG.SYSTEM_PROMPT },
              { role: "user", content: text }
            ]
          });
          hideLoading();
          
          if (!data.choices || !data.choices[0]?.message?.content) {
            throw new Error("Пустой ответ от модели");
          }
          addMessage(data.choices[0].message.content, 'ai');
          
        } else {
          const data = await makeRequest('/images/generations', {
            model: CONFIG.MODEL_IMAGE,
            prompt: text,
            n: 1,
            size: "1024x1024"
          });
          hideLoading();
          
          // Проверяем, что вернулось
          const imageUrl = data.data?.[0]?.url;
          const b64 = data.data?.[0]?.b64_json;
          
          if (imageUrl) {
            addMessage("Вот ваша картинка:", 'ai', imageUrl);
          } else if (b64) {
            // Если API вернул base64
            const dataUrl = `data:image/png;base64,${b64}`;
            addMessage("Вот ваша картинка:", 'ai', dataUrl);
          } else {
            throw new Error("API не вернул изображение");
          }
        }
        
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        
      } catch (error) {
        hideLoading();
        console.error('Full error:', error);
        addMessage(`Ошибка: ${error.message}`, 'ai');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      }
    }

    sendBtn.addEventListener('click', handleSend);
    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!sendBtn.disabled) handleSend();
      }
    });

  </script>
</body>
</html>
