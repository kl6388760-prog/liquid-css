<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e0f12" />
<title>Flyn AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0e0f12;
    --surface: #16181d;
    --surface-2: #1d2027;
    --surface-3: #252932;
    --border: #262a33;
    --text: #e8eaee;
    --text-dim: #9a9fab;
    --text-faint: #5f6470;
    --accent: #3ddc97;      /* меняем красный на бирюзу */
    --accent-soft: rgba(61,220,151,0.14);
    --danger: #ff5c7a;
    --bubble-ai: #1a1d24;
    --bubble-user: #21362c;
    --radius: 16px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --bar-space: 96px;      /* сколько оставить под мини-бар снизу */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    font-size: 15px;
    line-height: 1.5;
  }

  button, input, textarea { font-family: inherit; color: inherit; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: var(--safe-top);
    position: relative;
  }

  /* ================= TOPBAR ================= */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
    flex-shrink: 0;
    gap: 12px;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--accent-soft);
    border: 1px solid rgba(61,220,151,0.28);
    display: grid; place-items: center;
    color: var(--accent);
    flex-shrink: 0;
  }
  .brand-logo svg { width: 17px; height: 17px; fill: currentColor; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-sub { font-size: 10.5px; color: var(--text-faint); font-weight: 500; letter-spacing: 0.02em; }
  .topbar-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    display: grid; place-items: center;
    transition: background .15s, color .15s, border-color .15s, transform .12s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--surface-3); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .icon-btn.accent { background: var(--accent-soft); border-color: rgba(61,220,151,0.28); color: var(--accent); }

  /* ================= VIEWS ================= */
  .views {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
    padding-bottom: var(--bar-space); /* оставляем место под мини-бар */
  }
  .view {
    position: absolute; inset: 0; bottom: var(--bar-space);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transform: translateY(6px);
    transition: opacity .25s ease, transform .25s ease;
    min-height: 0;
  }
  .view.active { opacity: 1; pointer-events: auto; transform: none; }

  /* ================= CHAT ================= */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 6px 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth; min-height: 0;
  }
  .chat::-webkit-scrollbar { width: 0; }

  .welcome {
    margin: auto; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 24px 20px; max-width: 380px;
  }
  .welcome-logo {
    width: 72px; height: 72px; border-radius: 22px;
    background: var(--accent-soft);
    border: 1px solid rgba(61,220,151,0.28);
    display: grid; place-items: center;
    color: var(--accent); margin-bottom: 6px;
    box-shadow: 0 0 44px rgba(61,220,151,0.15);
  }
  .welcome-logo svg { width: 34px; height: 34px; fill: currentColor; }
  .welcome h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .welcome p { color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .suggestion {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 999px;
    padding: 8px 14px; font-size: 12.5px; cursor: pointer; transition: .15s;
  }
  .suggestion:hover { background: var(--surface-2); color: var(--text); border-color: var(--surface-3); }

  .msg { display: flex; gap: 10px; max-width: 100%; animation: rise .28s cubic-bezier(0.34,1.2,0.64,1); }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px;
    flex-shrink: 0; display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
  }
  .msg.ai .avatar { background: var(--accent-soft); border: 1px solid rgba(61,220,151,0.28); color: var(--accent); }
  .msg.user .avatar { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); }
  .avatar svg { width: 15px; height: 15px; fill: currentColor; }
  .bubble {
    padding: 11px 15px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
    max-width: calc(100% - 46px);
  }
  .msg.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--border); border-top-left-radius: 5px; }
  .msg.user .bubble { background: var(--bubble-user); border: 1px solid rgba(61,220,151,0.22); border-top-right-radius: 5px; color: #d9f5e7; }

  .typing { display: flex; gap: 4px; padding: 3px 1px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  @keyframes rise { from{opacity:0; transform: translateY(10px) scale(.97);} to{opacity:1; transform:none;} }

  /* ================= COMPOSER ================= */
  .composer-wrap { padding: 6px 14px 12px; flex-shrink: 0; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 8px 8px 8px 6px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color .2s, box-shadow .2s;
  }
  .composer:focus-within {
    border-color: rgba(61,220,151,0.4);
    box-shadow: 0 0 0 3px rgba(61,220,151,0.08);
  }
  .composer textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font-size: 15px; line-height: 1.45;
    max-height: 120px; min-height: 24px; padding: 8px 8px;
  }
  .composer textarea::placeholder { color: var(--text-faint); }

  .attach-btn, .send-btn {
    width: 40px; height: 40px; border-radius: 12px;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0; transition: background .15s, color .15s, transform .12s;
  }
  .attach-btn { background: transparent; color: var(--text-faint); }
  .attach-btn:hover { background: var(--surface-2); color: var(--text); }
  .attach-btn svg { width: 19px; height: 19px; fill: currentColor; }

  .send-btn { background: var(--accent); color: #0d1a13; }
  .send-btn:not(:disabled):hover { background: #4cecab; }
  .send-btn:not(:disabled):active { transform: scale(0.9); }
  .send-btn:disabled { background: var(--surface-3); color: var(--text-faint); cursor: default; }
  .send-btn svg { width: 19px; height: 19px; fill: currentColor; }

  /* ================= LISTS ================= */
  .panel {
    flex: 1; overflow-y: auto;
    padding: 8px 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 0;
  }
  .panel::-webkit-scrollbar { width: 0; }
  .panel-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-faint);
    padding: 6px 4px 2px;
  }
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; color: var(--text-faint); text-align: center; padding: 30px;
  }
  .empty svg { width: 40px; height: 40px; fill: currentColor; opacity: .5; }
  .empty h3 { font-size: 15px; font-weight: 600; color: var(--text-dim); }
  .empty p { font-size: 13px; max-width: 260px; line-height: 1.5; }

  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer; transition: .15s;
  }
  .chat-item:hover { background: var(--surface-2); border-color: var(--surface-3); }
  .chat-item .ci-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .chat-item .ci-icon svg { width: 16px; height: 16px; fill: currentColor; }
  .chat-item .ci-body { flex: 1; min-width: 0; }
  .chat-item .ci-title {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item .ci-meta { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }
  .chat-item .ci-del {
    width: 30px; height: 30px; border-radius: 8px;
    border: none; background: transparent; color: var(--text-faint);
    cursor: pointer; display: grid; place-items: center; transition: .15s;
  }
  .chat-item .ci-del:hover { background: rgba(255,92,122,0.12); color: var(--danger); }
  .chat-item .ci-del svg { width: 15px; height: 15px; fill: currentColor; }

  .file-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .file-item .fi-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--surface-2); color: var(--text-dim);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .file-item .fi-icon svg { width: 16px; height: 16px; fill: currentColor; }
  .file-item .fi-body { flex: 1; min-width: 0; }
  .file-item .fi-name {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-item .fi-size { font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }

  /* Settings */
  .settings-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .field { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 6px;
    letter-spacing: 0.02em; text-transform: uppercase;
  }
  .field input {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    font-size: 14px; outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: rgba(61,220,151,0.4); }
  .field input::placeholder { color: var(--text-faint); }
  .field .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; line-height: 1.5; }

  .btn-primary {
    width: 100%; padding: 13px;
    background: var(--accent); color: #0d1a13;
    border: none; border-radius: 12px;
    font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .btn-primary:hover { background: #4cecab; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-danger {
    width: 100%; padding: 13px;
    background: rgba(255,92,122,0.1); color: var(--danger);
    border: 1px solid rgba(255,92,122,0.28); border-radius: 12px;
    font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .btn-danger:hover { background: rgba(255,92,122,0.18); }

  /* ============================================================
     MENU BAR — 1-в-1 из твоего файла, только внизу и в тёмной теме
     ============================================================ */
  .bar-anchor {
    position: fixed;              /* меняем на fixed, чтобы прибить внизу */
    left: 0;
    right: 0;
    bottom: calc(12px + var(--safe-bottom));  /* вместо inset: 0 / center */
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 300;
  }

  .menu-bar {
    position: relative;
    display: flex;
    align-items: stretch;
    padding: 8px;
    border-radius: 999px;
    /* тёмная тема вместо #eaeaec */
    background: #16181d;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow:
      0 -10px 40px rgba(0, 0, 0, 0.5),
      0 0 0 0.5px rgba(0, 0, 0, 0.6) inset;
    pointer-events: auto;
    user-select: none;
    touch-action: none;
  }

  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 84px;
    padding: 10px 0 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    /* цвет текста — тёмная тема */
    color: #5f6470;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01rem;
    transition: color 0.15s ease;
    outline: none;
    overflow: hidden;
  }

  .tab svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
    display: block;
    flex-shrink: 0;
  }

  .tab-label {
    white-space: nowrap;
  }

  .tab.active {
    color: var(--accent);   /* бирюза вместо #f13545 */
  }

  /* линза — тот же .lens из файла */
  .lens {
    position: absolute;
    z-index: 1;
    top: 6px;
    bottom: 6px;
    left: 8px;
    width: 84px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(61,220,151,0.22);
    will-change: left, width, transform;
  }

  @media (max-width: 768px) {
    .tab { width: 72px; font-size: 12px; padding: 8px 0 7px; }
  }

  /* ================= TOAST ================= */
  .toast {
    position: fixed; left: 50%;
    bottom: calc(var(--bar-space) + var(--safe-bottom) + 8px);
    transform: translate(-50%, 20px);
    background: var(--surface-3); color: var(--text);
    padding: 10px 16px; border-radius: 12px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 400;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 640px) {
    #app { max-width: 520px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .bar-anchor { max-width: 520px; margin: 0 auto; left: 0; right: 0; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M3 12l4-8 5 12 4-6 5 2-6 10-4-8-3 4z"/></svg>
      </div>
      <div>
        <div class="brand-name">Flyn AI</div>
        <div class="brand-sub" id="statusLabel">готов к работе</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn accent" id="newChatBtn" title="Новый чат">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
    </div>
  </header>

  <div class="views">

    <!-- CHAT -->
    <section class="view active" data-view="chat">
      <main class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">
            <svg viewBox="0 0 24 24"><path d="M3 12l4-8 5 12 4-6 5 2-6 10-4-8-3 4z"/></svg>
          </div>
          <h1>Привет, я Flyn</h1>
          <p>Задай вопрос, попроси написать текст или код — я помогу.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-prompt="Объясни квантовую запутанность простыми словами">Квантовая запутанность</button>
            <button class="suggestion" data-prompt="Напиши план тренировок на неделю для новичка">План тренировок</button>
            <button class="suggestion" data-prompt="Сравни Python и JavaScript для веб-разработки">Python vs JS</button>
          </div>
        </div>
      </main>

      <div class="composer-wrap">
        <div class="composer">
          <button class="attach-btn" id="attachBtn" title="Прикрепить">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Написать Flyn..."></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- HISTORY -->
    <section class="view" data-view="history">
      <div class="panel">
        <div class="panel-title">История чатов</div>
        <div id="historyList"></div>
      </div>
    </section>

    <!-- FILES -->
    <section class="view" data-view="files">
      <div class="panel">
        <div class="panel-title">Файлы</div>
        <div id="filesList"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="view" data-view="settings">
      <div class="panel">
        <div class="panel-title">Подключение API</div>
        <div class="settings-group">
          <div class="field">
            <label>API URL</label>
            <input id="setUrl" type="text" placeholder="https://api.openai.com/v1/chat/completions" />
            <div class="hint">OpenAI, DeepSeek, Groq, OpenRouter — любой совместимый.</div>
          </div>
          <div class="field">
            <label>API Key</label>
            <input id="setKey" type="password" placeholder="sk-..." />
          </div>
          <div class="field">
            <label>Модель</label>
            <input id="setModel" type="text" placeholder="gpt-4o-mini" />
          </div>
        </div>

        <div class="panel-title" style="margin-top:8px">Данные</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn-primary" id="saveBtn">Сохранить настройки</button>
          <button class="btn-danger" id="clearAllBtn">Очистить всё</button>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- ============================================================
     MENU BAR — структура 1-в-1 из твоего menu-bar.html
     (те же 4 таба, те же иконки, та же .lens)
     ============================================================ -->
<div class="bar-anchor">
  <div class="menu-bar" id="menu-bar" role="tablist" aria-label="Menu">
    <button class="tab active" role="tab" aria-selected="true" data-view="chat">
      <svg viewBox="0 0 24 24">
        <path d="M12 3C7 3 3 6.6 3 11c0 2.2 1.1 4.2 2.9 5.6-.2 1-.7 2-1.5 2.9 1.4-.2 2.6-.7 3.6-1.4 1.2.5 2.6.8 4 .8 5 0 9-3.6 9-8s-4-8-9-8z"/>
      </svg>
      <span class="tab-label">Chat</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="history">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-2.3-5.7L14 10h8V2l-3.3 3.3A9.9 9.9 0 0 0 12 2z"/>
      </svg>
      <span class="tab-label">History</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="files">
      <svg viewBox="0 0 24 24">
        <path d="M4 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm8 0v5h5"/>
      </svg>
      <span class="tab-label">Files</span>
    </button>
    <button class="tab" role="tab" aria-selected="false" data-view="settings">
      <svg viewBox="0 0 24 24">
        <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4c0 .6-.05 1.2-.15 1.8l2.1 1.6-2 3.4-2.5-1a8 8 0 0 1-3.1 1.8l-.4 2.6h-4l-.4-2.6a8 8 0 0 1-3.1-1.8l-2.5 1-2-3.4 2.1-1.6A8 8 0 0 1 3 12c0-.6.05-1.2.15-1.8L1.05 8.6l2-3.4 2.5 1a8 8 0 0 1 3.1-1.8L9 1.8h4l.4 2.6a8 8 0 0 1 3.1 1.8l2.5-1 2 3.4-2.1 1.6c.1.6.15 1.2.15 1.8z"/>
      </svg>
      <span class="tab-label">Settings</span>
    </button>

    <!-- The glass lens: dragged and snapped between tabs -->
    <div class="lens" id="lens"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FLYN AI — app logic
   ============================================================ */
const store = {
  key: 'flyn_v2',
  data: {},
  load() {
    try { this.data = JSON.parse(localStorage.getItem(this.key) || '{}'); }
    catch { this.data = {}; }
    if (!this.data.settings) this.data.settings = {};
    if (!this.data.history) this.data.history = [];
    if (!this.data.files) this.data.files = [];
    return this.data;
  },
  save() { localStorage.setItem(this.key, JSON.stringify(this.data)); }
};
store.load();

const DEFAULT_SETTINGS = {
  apiUrl: 'https://api.openai.com/v1/chat/completions',
  apiKey: '',
  model: 'gpt-4o-mini',
};
const S = { ...DEFAULT_SETTINGS, ...store.data.settings };
const persistSettings = () => { store.data.settings = S; store.save(); };

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

const chat = $('#chat');
const input = $('#input');
const sendBtn = $('#sendBtn');
const attachBtn = $('#attachBtn');
const toastEl = $('#toast');

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ============================================================
   MENU BAR — точно как в файле: drag+snap, keyboard, elastic
   ============================================================ */
const bar = document.getElementById('menu-bar');
const lens = document.getElementById('lens');
const tabs = Array.from(bar.querySelectorAll('.tab'));
const views = $$('.view');
let activeIndex = 0;

const tabRect = (i) => {
  const t = tabs[i];
  return { left: t.offsetLeft, width: t.offsetWidth, center: t.offsetLeft + t.offsetWidth / 2 };
};

const setActive = (i) => {
  activeIndex = i;
  tabs.forEach((t, j) => {
    const on = j === i;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on);
  });
  views.forEach(v => {
    v.classList.toggle('active', v.dataset.view === tabs[i].dataset.view);
  });
};

const snapTo = (i, animate = true) => {
  const r = tabRect(i);
  setActive(i);
  if (animate) {
    gsap.to(lens, {
      left: r.left, width: r.width,
      duration: 0.7, ease: 'elastic.out(1, 0.7)', overwrite: 'auto'
    });
  } else {
    gsap.set(lens, { left: r.left, width: r.width });
  }
};

/* интро: как в файле — табы растут из 0, линза появляется позже */
const naturalWidths = tabs.map(t => t.offsetWidth);
const icons = tabs.map(t => t.querySelector('svg'));
const labels = tabs.map(t => t.querySelector('.tab-label'));

gsap.set(tabs, { width: 0 });
gsap.set([...icons, ...labels], { scale: 0, transformOrigin: '50% 50%' });
gsap.set(lens, { width: 0, scale: 0, transformOrigin: '50% 50%' });
gsap.set(labels[0], { opacity: 0 });

const revealLens = () => {
  snapTo(0, false);
  gsap.to(lens, { scale: 1, duration: 0.55, ease: 'back.out(2.4)' });
};

const introTl = gsap.timeline({
  onComplete: () => gsap.set(tabs, { clearProps: 'width' })
});

introTl
  .to(tabs[0], { width: naturalWidths[0], duration: 0.5, ease: 'expo.out' }, 0)
  .to(icons[0], { scale: 1, duration: 0.42, ease: 'back.out(2.4)' }, 0.28)
  .to(labels[0], { scale: 1, opacity: 1, duration: 0.42, ease: 'back.out(2.4)' }, 0.28);

const tabGap = 0.16;
tabs.slice(1).forEach((tab, j) => {
  const i = j + 1;
  const t0 = 0.8 + j * tabGap;
  introTl
    .to(tab, { width: naturalWidths[i], duration: 0.45, ease: 'expo.out' }, t0)
    .to(icons[i], { scale: 1, duration: 0.4, ease: 'back.out(2.3)' }, t0 + 0.22)
    .to(labels[i], { scale: 1, duration: 0.35, ease: 'back.out(2)' }, t0 + 0.3);
});

introTl.call(revealLens, null, '-=0.35');

tabs.forEach((tab, i) => {
  tab.addEventListener('click', () => snapTo(i));
  tab.addEventListener('pointerdown', () =>
    gsap.to(lens, { scale: 1.2, duration: 0.3, ease: 'power2.out' })
  );
  tab.addEventListener('pointerup', () =>
    gsap.to(lens, { scale: 1, duration: 0.7, ease: 'elastic.out(1, 0.7)' })
  );
  tab.addEventListener('pointercancel', () =>
    gsap.to(lens, { scale: 1, duration: 0.7, ease: 'elastic.out(1, 0.7)' })
  );
});

window.addEventListener('resize', () => snapTo(activeIndex, false));

window.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (!e.repeat) gsap.to(lens, { scale: 1.2, duration: 0.3, ease: 'power2.out' });
  if (e.key === 'ArrowLeft') snapTo(Math.max(activeIndex - 1, 0));
  else snapTo(Math.min(activeIndex + 1, tabs.length - 1));
});
window.addEventListener('keyup', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  gsap.to(lens, { scale: 1, duration: 0.7, ease: 'elastic.out(1, 0.7)' });
});

/* ============================================================
   CHAT
   ============================================================ */
let history = [
  { role: 'system', content: 'Ты Flyn — полезный, дружелюбный и лаконичный ИИ-помощник. Отвечай по делу, на русском языке. Код оформляй в тройных обратных кавычках.' }
];
let busy = false;

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function addMessage(role, text, save = true) {
  const w = document.getElementById('welcome');
  if (w) w.remove();
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const svg = role === 'user'
    ? '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M3 12l4-8 5 12 4-6 5 2-6 10-4-8-3 4z"/></svg>';
  el.innerHTML = `
    <div class="avatar">${svg}</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  if (save) history.push({ role, content: text });
}

function showTyping() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.id = 'typing';
  el.innerHTML = `
    <div class="avatar"><svg viewBox="0 0 24 24"><path d="M3 12l4-8 5 12 4-6 5 2-6 10-4-8-3 4z"/></svg></div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typing'); if (el) el.remove();
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  sendBtn.disabled = input.value.trim() === '' || busy;
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) send();
  }
});
sendBtn.addEventListener('click', send);

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;

  addMessage('user', text);
  input.value = ''; input.style.height = 'auto';
  busy = true; sendBtn.disabled = true;
  $('#statusLabel').textContent = 'думает...';
  showTyping();

  try {
    let reply;
    if (!S.apiKey) {
      await new Promise(r => setTimeout(r, 700));
      reply = 'Это демо-ответ. Открой Settings → вставь API-ключ и модель — и я начну отвечать по-настоящему.';
    } else {
      const res = await fetch(S.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${S.apiKey}` },
        body: JSON.stringify({ model: S.model, messages: history, temperature: 0.7, max_tokens: 1500 })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      reply = data.choices?.[0]?.message?.content ?? 'Пустой ответ от модели.';
    }
    hideTyping();
    addMessage('ai', reply);
    saveCurrentChatToHistory();
  } catch (err) {
    hideTyping();
    addMessage('ai', 'Ошибка: ' + err.message, false);
    console.error(err);
  } finally {
    busy = false;
    sendBtn.disabled = input.value.trim() === '';
    $('#statusLabel').textContent = 'готов к работе';
    input.focus();
  }
}

/* welcome suggestions */
$$('.suggestion').forEach(s => {
  s.addEventListener('click', () => {
    input.value = s.dataset.prompt;
    input.dispatchEvent(new Event('input'));
    input.focus();
  });
});

/* new chat */
$('#newChatBtn').addEventListener('click', () => {
  history.length = 1;
  chat.innerHTML = '';
  const tpl = document.createElement('div');
  tpl.className = 'welcome';
  tpl.id = 'welcome';
  tpl.innerHTML = `
    <div class="welcome-logo"><svg viewBox="0 0 24 24"><path d="M3 12l4-8 5 12 4-6 5 2-6 10-4-8-3 4z"/></svg></div>
    <h1>Привет, я Flyn</h1>
    <p>Задай вопрос, попроси написать текст или код — я помогу.</p>
  `;
  chat.appendChild(tpl);
  snapTo(0);
  setTimeout(() => input.focus(), 100);
});

/* ============================================================
   HISTORY / FILES / SETTINGS
   ============================================================ */
function saveCurrentChatToHistory() {
  const userMsgs = history.filter(m => m.role === 'user');
  if (!userMsgs.length) return;
  const title = userMsgs[0].content.slice(0, 60);
  const id = store.data.history.length ? Math.max(...store.data.history.map(h => h.id)) + 1 : 1;
  const now = new Date();
  const existing = store.data.history.find(h => h.title === title && h.date === now.toDateString());
  if (existing) {
    existing.messages = JSON.parse(JSON.stringify(history));
    existing.time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } else {
    store.data.history.unshift({
      id, title,
      date: now.toDateString(),
      time: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
      messages: JSON.parse(JSON.stringify(history)),
    });
  }
  store.save();
  renderHistory();
}

function renderHistory() {
  const list = $('#historyList');
  list.innerHTML = '';
  if (!store.data.history.length) {
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-2.3-5.7L14 10h8V2l-3.3 3.3A9.9 9.9 0 0 0 12 2z"/></svg>
        <h3>История пуста</h3>
        <p>Начни диалог, и он появится здесь.</p>
      </div>`;
    return;
  }
  store.data.history.forEach(h => {
    const el = document.createElement('div');
    el.className = 'chat-item';
    el.innerHTML = `
      <div class="ci-icon"><svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 6.6 3 11c0 2.2 1.1 4.2 2.9 5.6-.2 1-.7 2-1.5 2.9 1.4-.2 2.6-.7 3.6-1.4 1.2.5 2.6.8 4 .8 5 0 9-3.6 9-8s-4-8-9-8z"/></svg></div>
      <div class="ci-body">
        <div class="ci-title">${escapeHtml(h.title)}</div>
        <div class="ci-meta">${h.time} · ${h.messages.filter(m => m.role !== 'system').length} сообщ.</div>
      </div>
      <button class="ci-del" title="Удалить">
        <svg viewBox="0 0 24 24"><path d="M6 7h12v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7zm3-3h6l1 2H8l1-2zM4 7h16v2H4z"/></svg>
      </button>
    `;
    el.querySelector('.ci-body').addEventListener('click', () => {
      history = JSON.parse(JSON.stringify(h.messages));
      chat.innerHTML = '';
      history.filter(m => m.role !== 'system').forEach(m => addMessage(m.role, m.content, false));
      snapTo(0);
    });
    el.querySelector('.ci-del').addEventListener('click', (e) => {
      e.stopPropagation();
      store.data.history = store.data.history.filter(x => x.id !== h.id);
      store.save(); renderHistory();
      toast('Чат удалён');
    });
    list.appendChild(el);
  });
}

function renderFiles() {
  const list = $('#filesList');
  list.innerHTML = '';
  if (!store.data.files.length) {
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M4 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4zm8 0v5h5"/></svg>
        <h3>Файлов нет</h3>
        <p>Прикрепи файл через кнопку скрепки в чате.</p>
      </div>`;
    return;
  }
  store.data.files.forEach(f => {
    const el = document.createElement('div');
    el.className = 'file-item';
    el.innerHTML = `
      <div class="fi-icon"><svg viewBox="0 0 24 24"><path d="M4 4a2 2 0 0 1 2-2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/></svg></div>
      <div class="fi-body">
        <div class="fi-name">${escapeHtml(f.name)}</div>
        <div class="fi-size">${(f.size / 1024).toFixed(1)} КБ · ${f.date}</div>
      </div>
    `;
    list.appendChild(el);
  });
}

attachBtn.addEventListener('click', () => {
  const fi = document.createElement('input');
  fi.type = 'file';
  fi.accept = 'image/*,.pdf,.txt,.doc,.docx';
  fi.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    addMessage('user', `📎 Файл: ${file.name} (${(file.size / 1024).toFixed(1)} КБ)`, false);
    store.data.files.push({
      name: file.name,
      size: file.size,
      date: new Date().toLocaleDateString('ru-RU'),
    });
    store.save(); renderFiles();
    toast('Файл прикреплён');
  };
  fi.click();
});

function loadSettingsUI() {
  $('#setUrl').value = S.apiUrl;
  $('#setKey').value = S.apiKey;
  $('#setModel').value = S.model;
}
loadSettingsUI();

$('#saveBtn').addEventListener('click', () => {
  S.apiUrl = $('#setUrl').value.trim() || DEFAULT_SETTINGS.apiUrl;
  S.apiKey = $('#setKey').value.trim();
  S.model = $('#setModel').value.trim() || DEFAULT_SETTINGS.model;
  persistSettings();
  toast('Настройки сохранены');
});

$('#clearAllBtn').addEventListener('click', () => {
  if (!confirm('Удалить всю историю, файлы и ключ?')) return;
  store.data.history = [];
  store.data.files = [];
  S.apiKey = '';
  persistSettings();
  store.save();
  renderHistory(); renderFiles(); loadSettingsUI();
  toast('Все данные очищены');
});

/* INIT */
renderHistory();
renderFiles();
snapTo(0, false);
</script>
</body>
</html>
